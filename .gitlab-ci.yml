# ===========================================================================
# 基础设施流水线 —— push 即部署的蓝绿灰度流水线（全自动，无人工门）
# ===========================================================================
#
# 部署模型（用户定的，2026-10-23）：
#
#   git push
#     → terraform 建**新槽位**的整套资源（旧槽位不受影响，一直在线服务）
#     → 流水线拿到新机器的公网 IP
#     → ansible 初始化新机器（基线 + Docker + 应用，版本 = commit 短 SHA）
#     → 请求新机器的 nginx 做健康检查（200 且版本标记 = 本次 commit）
#     → 失败：销毁新槽位（rollback），旧机器毫发无损，流水线红
#     → 成功：销毁旧槽位（cutover），新机器成为现网，流水线绿
#
#   通知 = 流水线本身的状态（绿=发布成功，红=已回滚），另留 NOTIFY_WEBHOOK。
#
# 槽位记账：blue / green 各是一个 terraform workspace，state 在 OSS 里按
# workspace 前缀隔离。哪边有机器哪边在服务，tools/gray_slot.sh 负责算。
#
# 为什么撤掉人工放行也能放心：
#   人肉点 manual 换来的是"发布前有人看一眼"；灰度模型把它换成了
#   "发布后机器自证健康，不健康自动退回"。旧机器在整个窗口内在线，
#   最坏情况 = 浪费一台按量付费机器几十分钟，不是停服。
#   护栏（B7）相应改成两条硬规则：变更 job 必须限定默认分支；
#   流水线必须存在回滚 job —— 少了任何一个，validate 就红。
#
# 仍然保留人工的两件事（不在 push 触发的部署路径上）：
#   configure:local  碰本地存量服务器（两道门不变）
#   teardown         整组销毁（不可逆，永远不该被一个 push 自动触发）
#
# ---------------------------------------------------------------------------
# runner 侧需要的东西（RUNNER_147.local.sh 收敛，都是 147 机器自己的）：
#   /root/.wf-aliyun.env      key 变量（ALICLOUD_* / WF_SSH_KEY_FILE / WF_SSH_USER）
#   /root/.wf-aliyun.tfvars   terraform 入参（ssh_public_key / ssh_allowed_cidr / zone_id ...）
#   /root/.wf-terraform.rc    provider 镜像配置（可选；没有则走默认源）
# 这三个路径都能用 CI Variables（WF_ENV_FILE / WF_TFVARS_FILE / WF_TF_RC）覆盖。
# ===========================================================================

stages:
  - validate
  - gray-prepare
  - gray-apply
  - gray-deploy
  - gray-health
  - gray-decide
  - notify

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ROOT: "$CI_PROJECT_DIR/aliyun-ecs"
  ANSIBLE_ROOT: "$CI_PROJECT_DIR/ansible"
  ARTIFACT_DIR: "$CI_PROJECT_DIR/.ci-artifacts"
  WF_SSH_USER: "root"
  # 机器侧文件（见文件头注释），路径可被 CI Variables 覆盖
  WF_ENV_FILE: "/root/.wf-aliyun.env"
  WF_TFVARS_FILE: "/root/.wf-aliyun.tfvars"
  WF_TF_RC: "/root/.wf-terraform.rc"

default:
  tags:
    # ★ 必须和注册 runner 时的 --tag-list 一致，不一致 job 会永远 stuck
    - wf-infra
  before_script:
    - set -eo pipefail
    - |
      # ── 凭证加载 ────────────────────────────────────────────────
      # shell executor 不继承登录 shell。机器侧文件优先，
      # CI Variables 与它并存时以文件为准（换 runner 时删文件、改走 Variables）。
      if [ -f "${WF_ENV_FILE:-/root/.wf-aliyun.env}" ]; then
        set -a; . "${WF_ENV_FILE:-/root/.wf-aliyun.env}"; set +a
      fi
    - |
      # ── terraform 镜像配置（可选）────────────────────────────────
      if [ -f "${WF_TF_RC:-/root/.wf-terraform.rc}" ]; then
        export TF_CLI_CONFIG_FILE="${WF_TF_RC:-/root/.wf-terraform.rc}"
      fi
    - |
      # ── 工具链自检 ──────────────────────────────────────────────
      # shell executor 只用 config.toml 里 environment 写的 PATH。
      # 缺一个目录，症状是第一行 command not found，而流水线不会
      # 告诉你这是 PATH 的事 —— 所以先花三行问清楚。
      missing=0
      for tool in python3 terraform ansible-playbook curl; do
        if ! command -v "$tool" >/dev/null 2>&1; then
          echo "✗ runner 上找不到 $tool"
          missing=1
        fi
      done
      if [ "$missing" -ne 0 ]; then
        echo
        echo "  修法：把它所在目录写进 /etc/gitlab-runner/config.toml 的"
        echo "        environment = [\"PATH=...\"]，然后 systemctl restart gitlab-runner。"
        exit 1
      fi
    - |
      # ── tfvars 就位检查（apply 的入参：ssh_public_key / cidr 等）──
      if [ ! -f "${WF_TFVARS_FILE:-/root/.wf-aliyun.tfvars}" ]; then
        echo "✗ 找不到 ${WF_TFVARS_FILE:-/root/.wf-aliyun.tfvars}（terraform 的入参文件）。"
        echo "  没有它，新机器拿不到 SSH 公钥 —— 建出来也登不进去。"
        echo "  修法：在 147 上跑 RUNNER_147.local.sh（会把 tfvars 收敛到这个路径）。"
        # validate 段不需要它；带不需要 tfvars 的判断放在用到的 job 里做
      fi

# 避免 push 和 MR 各触发一条流水线
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

.tf-vars-args: &tf-vars-args >-
  if [ ! -f "${WF_TFVARS_FILE:-/root/.wf-aliyun.tfvars}" ]; then
  echo "✗ ${WF_TFVARS_FILE:-/root/.wf-aliyun.tfvars} 不存在 —— terraform 入参（SSH 公钥、放行网段）没有着落。";
  echo "  在 runner 机器上跑一次 RUNNER_147.local.sh，或用 CI Variables 配 WF_TFVARS_FILE 指向实际路径。";
  exit 1; fi

# ---------------------------------------------------------------------------
# 1. validate：不需要凭证、不碰机器。这一段红了，后面全部不用跑
# ---------------------------------------------------------------------------

validate:boundaries:
  stage: validate
  script:
    - echo "── 分层边界静态校验 ──"
    - python3 tools/check_boundaries.py --require-remote-state --require-ci
    - echo
    - echo "── Ansible 侧护栏（纯离线）──"
    - cd ansible
    - python3 tools/check_guard.py
    - python3 tools/check_guard.py --selftest
    - python3 tools/selftest.py

validate:terraform:
  stage: validate
  script:
    - cd "$TF_ROOT"
    - terraform fmt -check -recursive
    # -backend=false：语法校验不需要后端，也就不需要凭证
    - terraform init -backend=false -input=false
    - terraform validate

# ---------------------------------------------------------------------------
# 2. gray:slot —— 算槽位：哪边在服务（active）、这次建哪边（new）
# ---------------------------------------------------------------------------

gray:slot:
  stage: gray-prepare
  script:
    - mkdir -p "$ARTIFACT_DIR"
    # 脚本的环境变量行走 stdout，人类日志走 stderr —— tee 进 artifact，eval 进环境
    - eval "$($CI_PROJECT_DIR/tools/gray_slot.sh | tee "$ARTIFACT_DIR/slot.env")"
    - echo "ACTIVE=${ACTIVE_SLOT:-（无，首次部署）}  NEW=$NEW_SLOT"
  artifacts:
    expire_in: 1 day
    paths:
      - .ci-artifacts/
  rules:
    # 只在默认分支上算槽位：feature 分支的流水线止步于 validate，
    # 也避免只读验证顺手在 backend 里建出空 workspace
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# 3. gray:apply —— 在新槽位上 apply。旧槽位的 state 在另一个 workspace 里，
#    这个动作物理上碰不到它。已有限定默认分支（B7），无人工门。
# ---------------------------------------------------------------------------

gray:apply:
  stage: gray-apply
  needs:
    - job: gray:slot
      artifacts: true
  script:
    - *tf-vars-args
    - cd "$TF_ROOT"
    - eval "$(cat "$ARTIFACT_DIR/slot.env")"
    - terraform init -input=false -lock-timeout=5m
    - terraform workspace select "$NEW_SLOT" || terraform workspace new "$NEW_SLOT"
    - echo "── 在槽位 $NEW_SLOT 上建/更新资源（旧槽位 $ACTIVE_SLOT 不受影响）──"
    - terraform apply -input=false -lock-timeout=5m -auto-approve -var-file="${WF_TFVARS_FILE}"
    - mkdir -p "$ARTIFACT_DIR"
    # 新机器的公网 IP 就在这里面 —— 这是 Terraform 交给 Ansible 的唯一输入
    - terraform output -json > "$ARTIFACT_DIR/tf-outputs.json"
  artifacts:
    name: "tf-outputs-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
    paths:
      - .ci-artifacts/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# 4. gray:configure —— Ansible 初始化新机器。只消费 artifact，不碰 terraform
# ---------------------------------------------------------------------------

gray:configure:
  stage: gray-deploy
  needs:
    - job: gray:apply
      artifacts: true
  script:
    - cd "$ANSIBLE_ROOT"
    # 生成清单的同时会清掉这批 IP 的旧主机键：蓝绿每次都是 destroy 一台建一台，
    # 公网 IP 必然被复用，known_hosts 里上一台机器的键会让第一幕直接 UNREACHABLE
    - python3 tools/gen_cloud_inventory.py --from-output-json "$ARTIFACT_DIR/tf-outputs.json" --user "${WF_SSH_USER:-root}" --ssh-key "${WF_SSH_KEY_FILE:-$HOME/.ssh/id_ed25519}"
    # 版本名 = commit。写进页面、releases/<版本>/、current 指针 —— 健康检查就靠它对版本
    - ansible-playbook playbooks/site.yml --limit cloud -e "wf_release=$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# 5. gray:health —— 验收门：请求新机器的 nginx，200 且版本 = 本次 commit
# ---------------------------------------------------------------------------

gray:health:
  stage: gray-health
  needs:
    - job: gray:apply
      artifacts: true
  script:
    - |
      NEW_IP="$(python3 -c "
      import json
      d = json.load(open('$ARTIFACT_DIR/tf-outputs.json'))
      ips = (d.get('instance_public_ips', {}) or {}).get('value') or {}
      assert ips, 'tf-outputs.json 里没有公网 IP'
      print(list(ips.values())[0])
      ")"
      echo "── 对新机器 http://${NEW_IP}/ 做健康检查（期望版本 $CI_COMMIT_SHORT_SHA）──"
      bash "$CI_PROJECT_DIR/tools/health_check.sh" "$NEW_IP" "$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# 6. gray:decide —— 二选一：
#    健康检查过了 → cutover：销毁旧槽位，新机器成为现网
#    前面任何一步挂了 → rollback：销毁新槽位，旧机器一直在服务
# ---------------------------------------------------------------------------

gray:cutover:
  stage: gray-decide
  needs:
    - job: gray:slot
      artifacts: true
    - job: gray:health
  script:
    - *tf-vars-args
    - cd "$TF_ROOT"
    - eval "$(cat "$ARTIFACT_DIR/slot.env")"
    - terraform init -input=false -lock-timeout=5m
    - |
      if [ -z "${ACTIVE_SLOT:-}" ]; then
        echo "── 首台机器，没有旧槽位可撤。$NEW_SLOT 从此就是现网。──"
        exit 0
      fi
      echo "── 健康检查通过 → 销毁旧槽位 $ACTIVE_SLOT（新机器 $NEW_SLOT 接管）──"
      terraform workspace select "$ACTIVE_SLOT"
      terraform destroy -input=false -lock-timeout=5m -auto-approve -var-file="${WF_TFVARS_FILE}"
    - echo "✓ 本次发布完成：$NEW_SLOT 在服务（版本 $CI_COMMIT_SHORT_SHA），旧槽位已回收"
    - echo "result=cutover slot=$NEW_SLOT active=${ACTIVE_SLOT:-none} version=$CI_COMMIT_SHORT_SHA" > "$ARTIFACT_DIR/result.txt"
  artifacts:
    expire_in: 1 day
    paths:
      - .ci-artifacts/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

gray:rollback:
  stage: gray-decide
  # needs + when: on_failure：前面任何一个环节失败（建机器/初始化/健康检查），
  # 这个 job 就会跑 —— 销毁建了一半的新槽位。旧槽位从头到尾没被动过。
  needs:
    - job: gray:slot
      artifacts: true
    - job: gray:apply
      artifacts: true
      optional: true
    - job: gray:health
      optional: true
  when: on_failure
  script:
    - *tf-vars-args
    - cd "$TF_ROOT"
    - eval "$(cat "$ARTIFACT_DIR/slot.env")"
    - terraform init -input=false -lock-timeout=5m
    - echo "── 部署/健康检查失败 → 回滚：销毁新槽位 $NEW_SLOT（旧槽位 $ACTIVE_SLOT 一直在服务）──"
    - terraform workspace select "$NEW_SLOT"
    - terraform destroy -input=false -lock-timeout=5m -auto-approve -var-file="${WF_TFVARS_FILE}"
    - |
      if [ -n "${ACTIVE_SLOT:-}" ]; then
        echo "✓ 回滚完成：现网仍是 $ACTIVE_SLOT（上一版），本次 commit $CI_COMMIT_SHORT_SHA 未上线"
      else
        echo "✗ 首次部署失败且没有旧机器 —— 现在没有任何机器在服务。"
        echo "  看上面失败环节的日志修复后，重新 push 触发即可。"
      fi
    - echo "result=rollback slot=$NEW_SLOT active=${ACTIVE_SLOT:-none} version=$CI_COMMIT_SHORT_SHA" > "$ARTIFACT_DIR/result.txt"
  artifacts:
    expire_in: 1 day
    paths:
      - .ci-artifacts/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# 7. notify —— 收场报告。成功/失败两个方向都会走到这里。
#    通知本体 = 流水线状态（绿 = 已上线，红 = 已回滚）；
#    配了 NOTIFY_WEBHOOK 的话再 POST 一份摘要（钉钉/企微/飞书机器人通用）。
# ---------------------------------------------------------------------------

gray:notify:
  stage: notify
  when: always
  needs:
    - job: gray:cutover
      artifacts: true
      optional: true
    - job: gray:rollback
      artifacts: true
      optional: true
  script:
    - |
      # 结果判据不靠 $CI_JOB_STATUS（它只在 after_script 里有）：
      # cutover / rollback 谁跑了，谁就留下 result.txt
      RESULT="pipeline_failed_early（部署还没走到二选一就挂了，回看前段日志）"
      if [ -f "$ARTIFACT_DIR/result.txt" ]; then
        RESULT="$(cat "$ARTIFACT_DIR/result.txt")"
      fi
      SLOT_INFO="（槽位信息未生成）"
      [ -f "$ARTIFACT_DIR/slot.env" ] && SLOT_INFO="$(tr '\n' ' ' < "$ARTIFACT_DIR/slot.env")"
      NEW_IP=""
      if [ -f "$ARTIFACT_DIR/tf-outputs.json" ]; then
        NEW_IP="$(python3 -c "
        import json
        d = json.load(open('$ARTIFACT_DIR/tf-outputs.json'))
        ips = (d.get('instance_public_ips', {}) or {}).get('value') or {}
        print(list(ips.values())[0] if ips else '')
        " 2>/dev/null || true)"
      fi
      echo "═══════════════════════════════════════════"
      echo " 发布摘要  commit=$CI_COMMIT_SHORT_SHA  branch=$CI_COMMIT_BRANCH"
      echo " 结果：$RESULT"
      echo " 槽位：$SLOT_INFO"
      echo " 新机器 IP：${NEW_IP:-（未能取得）}"
      echo " 流水线状态 = 本次发布结果：绿=上线，红=已回滚到旧机器"
      echo "═══════════════════════════════════════════"
      # 放项目目录不放 /tmp：job 用户切换后（gitlab-runner -> root），/tmp 里的
      # 旧文件属主不对会让重定向直接 Permission denied；.ci-artifacts 每次 job
      # 前被 runner 清掉，属主必然是当前用户。
      mkdir -p .ci-artifacts
      echo "$RESULT" > .ci-artifacts/wf_result_line
    - |
      if [ -n "${NOTIFY_WEBHOOK:-}" ]; then
        RESULT_LINE="$(cat .ci-artifacts/wf_result_line)"
        curl -sS --max-time 10 -H 'Content-Type: application/json' \
          -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"terraform-demo $CI_COMMIT_SHORT_SHA：$RESULT_LINE\"}}" \
          "$NOTIFY_WEBHOOK" || echo "webhook 通知失败（不影响流水线结论）"
      else
        echo "（未配置 NOTIFY_WEBHOOK，跳过外部通知）"
      fi

# ---------------------------------------------------------------------------
# 附：本地存量服务器（不在灰度路径上，两道人工门不变）
# ---------------------------------------------------------------------------

configure:local:
  stage: gray-deploy
  script:
    - cd "$ANSIBLE_ROOT"
    - echo "本地服务器默认完全只读。要真的动手，得先有人点这一下 ——"
    - echo "而且命令里还要显式带上解锁开关。两道门都要过。"
    - ansible-playbook playbooks/site.yml --limit local -e local_mutation_allowed=true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false

# ---------------------------------------------------------------------------
# 附：teardown —— 整组销毁。不可逆，永远不该被一个 push 自动触发。
#   两个槽位一起清：跑两次（blue / green）。
# ---------------------------------------------------------------------------

teardown:
  stage: notify
  script:
    - *tf-vars-args
    - cd "$TF_ROOT"
    - terraform init -input=false -lock-timeout=5m
    - for slot in blue green; do
        if terraform workspace select "$slot" 2>/dev/null; then
          echo "── 销毁槽位 $slot ──";
          terraform destroy -input=false -lock-timeout=5m -auto-approve -var-file="${WF_TFVARS_FILE}" || true;
        else
          echo "── 槽位 $slot 不存在，跳过 ──";
        fi;
      done
    - terraform workspace select default
    - echo "✓ 两个槽位都已回收（不存在的已跳过）"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
