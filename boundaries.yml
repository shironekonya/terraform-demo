# ===========================================================================
# 跨层衔接声明清单
# ===========================================================================
#
# 为什么需要这个文件
#
#   各层的默认关系是「互不触发」：Terraform 不管机器内部状态，Ansible 不碰云资源。
#   但现实里总有一两次数据要从一层传到另一层 —— 比如「云机器的 IP 只有 Terraform
#   知道，而 Ansible 必须知道它才能连上去」。
#
#   这种衔接本身不是问题，**没有边界地悄悄发生**才是问题。所以这里把每一处衔接
#   都写成一条显式声明：谁发起、调谁、什么方向、为什么。没有写在这里的跨层调用，
#   tools/check_boundaries.py 的 B8 会直接判失败。
#
# 三条硬规则（校验器强制，声明本身也不能违反）
#
#   1. 方向只有一种：某一层**只读地**读 Terraform 的输出。
#      to 只能是 terraform —— 反方向（调用 Ansible）属于 B1 的地盘，
#      用声明去解决 B1 等于把安全阀当开关用。
#      （方向钉死之后「单向」就是结构性的：环根本构造不出来。）
#   2. 只能声明 read。写方向的衔接永远不开放，写在这里也是错，
#      校验器会报 —— 没有「特殊情况可以例外」这回事。
#   3. 必须写 why。写不出理由，说明这条衔接本就不该存在。
#
# 在流水线里不需要这些声明
#
#   CI 里 Terraform 与 Ansible 是两个独立 job，靠 artifact 传数据，
#   Ansible 侧连 terraform 命令都不执行 —— 跨层调用数 = 0，自然无需声明。
#   这份清单管的是「人在自己机器上手工跑」的那条路径。
#
# 语法
#
#   顶层只有两个段：handoffs（跨层衔接）和 exemptions（检查豁免）。
#   只支持这个文件用到的那一小撮 YAML 子集（顶层键 + 列表 + 标量）。
#   写了子集之外的写法，校验器**报语法错**而不是猜 ——
#   猜错的后果是「声明被静默忽略」，那比没有声明更危险。
#
# handoffs 的字段含义
#
#   from   谁发起这次衔接（ansible / glue）
#   to     只能是 terraform（见上面第 1 条）
#   mode   只能是 read
#   where  发起方的哪个文件（相对仓库根）
#   why    为什么必须有这一条。给下一个动这块代码的人看。
# ===========================================================================

handoffs:
  - from: ansible
    to: terraform
    mode: read
    where: ansible/tools/gen_cloud_inventory.py
    why: "云服务器的 IP 只有 Terraform 知道，Ansible 必须拿到它才能连上去。这里只读 output，不碰 state、不触发任何变更。流水线里走 artifact，连这一条也不会发生。"

# ---------------------------------------------------------------------------
# 豁免清单
# ---------------------------------------------------------------------------
#
# 为什么需要这个段
#
#   检查器只认「运行路径」上的代码。但仓库里总有一些**不参与运行**的东西：
#   停用的旧方案、语法参考、教学对照。它们不必遵守运行时的边界，
#   因为根本不会被跑起来。
#
#   问题在于「谁不参与运行」这件事如果靠目录名去猜（比如「以 archive 开头
#   就跳过」），那就是一个隐式约定：谁把目录改个名，豁免就静默失效，
#   检查器突然对着一堆存档代码报红 —— 而那些红全是噪音。
#   反过来更糟：真在跑的代码被放进一个叫 archive- 的目录，就再也查不到了。
#
#   所以豁免必须**登记在册**：写清楚哪个路径、为什么不参与运行。
#   没有登记在这里的，一律按运行路径检查。
#
# 字段
#
#   path  相对仓库根的路径前缀（目录或文件）
#   why   为什么它不参与运行。写不出理由，说明它该被删掉，而不是被豁免。
#
# 注意
#
#   豁免的是「不参与运行」，不是「网开一面」。登记在这里的路径，
#   所有边界检查都不覆盖它 —— 所以它必须真的不会被跑起来。
# ---------------------------------------------------------------------------

exemptions:
  - path: vmware-workstation/archive-vm-clone
    why: "停用的旧方案：用 vmrun 从模板克隆宿主机上的虚机。它与本项目的边界「组件全部跑在虚拟机内部、宿主机只提供虚拟化能力、宿主机上的虚拟化平台不声明为资源」直接相悖，已停用，仅留作教学对照。不参与运行，也不参与任何检查。"
  - path: vmware-vsphere-reference
    why: "语法参考：vSphere 官方 provider 的写法，供以后真要迁到 vCenter/ESXi 时对照。需要 vCenter 才能 init，本项目不用它。因此不作为「在用模块」检查（也就不需要 backend），不参与运行。"
  - path: tools/install_runner.sh
    why: "CI 执行器自身的引导脚本（一次性 bootstrap，跑完即退出运行路径）。它装包、起服务，正是 B6 说的「机器内部状态」—— 但这里做不到交给 Ansible：脚本装的是**运行 Ansible 的那台机器的 runner**，鸡生蛋问题，执行器无法由自己的流水线安装自己。装完之后，runner 主机上的任何进一步变更仍归 Ansible（且它在 local 组，默认只读）。因此登记为豁免，而不是让 B6 的提示长期挂着、慢慢变成背景噪音。"
