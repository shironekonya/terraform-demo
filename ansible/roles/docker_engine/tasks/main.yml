---
# ===========================================================================
# Docker 运行时（云服务器专用）
#
# 这是一个 **cloud-only role**：本地服务器上跑着 compose 管的 Jenkins/Harbor，
# 在它们上面动 Docker 的安装或守护进程配置，风险远大于收益。
# 所以它第一件事就是断言"我不在本地服务器上"。
# tools/check_guard.py 会强制这个断言存在。
# ===========================================================================

- name: "docker_engine · 断言：本 role 只能用于云服务器"
  ansible.builtin.assert:
    that:
      - not (wf_in_local_group | bool)
    fail_msg: |
      ⛔ 拒绝执行：docker_engine 是云服务器专用 role，但它正跑在本地服务器
      {{ inventory_hostname }} 上。

      本地服务器上的 Docker 承载着 compose 管的 Jenkins / Harbor，
      动它的安装或守护进程配置（daemon.json）会牵连到那两个服务。

      如果你确实要在本地服务器上装 Docker，请单独写一个 role，
      并显式接受那份风险 —— 不要把这个 role 放进本地 play 里。
    quiet: true

- name: "docker_engine · 安装参数"
  ansible.builtin.debug:
    msg:
      - "发行版族      : {{ ansible_os_family }}"
      - "Docker 主包   : {{ wf_docker_package }}"
      - "compose 插件包: {{ wf_docker_compose_package }}"
      - "日志上限      : {{ wf_docker_log_max_size }} × {{ wf_docker_log_max_file }} 个文件"

# ---------------------------------------------------------------------------
# 安装
# ---------------------------------------------------------------------------

- name: "docker_engine · 探测 docker 是否已存在（只读）"
  ansible.builtin.command: docker --version
  register: wf_docker_probe
  changed_when: false
  failed_when: false

- name: "docker_engine · 安装 Docker 主包"
  ansible.builtin.package:
    name: "{{ wf_docker_package }}"
    state: present
  when: wf_docker_probe.rc != 0

- name: "docker_engine · 探测 compose 子命令（只读）"
  ansible.builtin.command: docker compose version
  register: wf_compose_probe
  changed_when: false
  failed_when: false

- name: "docker_engine · 补装 compose v2 插件"
  ansible.builtin.package:
    name: "{{ wf_docker_compose_package }}"
    state: present
  # 各发行版的包名不统一，装不上不致命（还可能已经有 v1 的 docker-compose）。
  # 下面的复检会给出准确结论。
  failed_when: false
  when: wf_compose_probe.rc != 0

- name: "docker_engine · 复检 compose 子命令（只读）"
  ansible.builtin.command: docker compose version
  register: wf_compose_recheck
  changed_when: false
  failed_when: false
  when: wf_compose_probe.rc != 0

- name: "docker_engine · compose 不可用的应对说明"
  ansible.builtin.debug:
    msg:
      - "⚠ 这台机器上 `docker compose` 不可用。"
      - "  各发行版包名不一样，常见的候选："
      - "    Alibaba Cloud Linux / RHEL : dnf install -y docker-compose-plugin"
      - "    Ubuntu / Debian            : apt-get install -y docker-compose-v2"
      - "  装好后重跑本 playbook 即可。"
      - "  依赖 compose 的 role（app_stack）会自动跳过，不会因此失败。"
  when:
    - wf_compose_probe.rc != 0
    - wf_compose_recheck.rc | default(1) != 0

# ---------------------------------------------------------------------------
# 守护进程配置
# ---------------------------------------------------------------------------

- name: "docker_engine · 确保 /etc/docker 存在"
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

# 在**控制端**先把渲染结果当 JSON 解析一遍。
# 这一步的价值：模板里的逗号/引号写错会在任务执行前就报错，
# 而不是把一个坏掉的 daemon.json 写到机器上、让 docker 起不来之后才发现。
- name: "docker_engine · 先验证 daemon.json 渲染结果是合法 JSON"
  ansible.builtin.assert:
    that:
      - (lookup('template', 'daemon.json.j2') | from_json) is mapping
    fail_msg: |
      ⛔ daemon.json 模板渲染出来的内容不是合法 JSON。
      模板：roles/docker_engine/templates/daemon.json.j2
      渲染结果：
      {{ lookup('template', 'daemon.json.j2') }}
    quiet: true

- name: "docker_engine · 写入 daemon.json"
  ansible.builtin.copy:
    content: "{{ lookup('template', 'daemon.json.j2') }}"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: 重启 docker

- name: "docker_engine · 启用并启动 docker"
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  failed_when: false

- name: "docker_engine · 把用户加入 docker 组"
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ wf_docker_users }}"
  when: (wf_docker_users | length) > 0

- name: "docker_engine · 完成"
  ansible.builtin.debug:
    msg:
      - "docker           : {{ wf_docker_probe.stdout | default('（本次刚装）') }}"
      - "daemon.json      : /etc/docker/daemon.json（日志轮转 {{ wf_docker_log_max_size }} × {{ wf_docker_log_max_file }}）"
      - "★ 容器日志不限大小是云上'系统盘突然满了'的头号原因，所以这里是默认开启的。"
