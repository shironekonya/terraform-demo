---
# ---------------------------------------------------------------------------
# 只在配置真的变了才 reload。
# 用 reload 而不是 restart：reload 不中断已建立的连接，容器那一侧完全无感。
#
# 注意 handler 是在 play 结束时才跑的 —— 所以 tasks 里有一处显式
# `meta: flush_handlers`，好让紧随其后的自检看到的是**新配置**生效后的结果。
# 不 flush 的话，自检可能打在旧配置上，得到一个假通过。
# ---------------------------------------------------------------------------
- name: 重载 nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
