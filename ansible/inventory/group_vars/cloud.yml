---
# ===========================================================================
# 云服务器（cloud 组）
#
# 定位：Terraform 创建的、可以随时 destroy 重建的机器。
#      所以这里允许「全量配置」—— 配错了重来一台就好，代价最低。
#
# 对照着看 group_vars/local.yml：那份才是受保护的。
# ===========================================================================

# 阿里云 ECS 默认用 root 登录，不需要 sudo
ansible_user: root
ansible_become: false

# 对应 aliyun-ecs 里创建的密钥对。
# ★ 如果 aliyun-ecs 用的是「实例密码」而不是密钥对，
#   把这里换成 ansible_password 并把 ansible_ssh_private_key_file 注释掉。
ansible_ssh_private_key_file: ~/.ssh/id_ed25519

# ---------------------------------------------------------------------------
# 保护声明：本组**不受保护**，允许变更
#
# guard 角色读这个值。它是"人可读的声明"，真正的判定还叠加了一条
# 「本机是否落在 local 组里」——两个条件取"或"，所以任何一边标对了就保护得上。
# ---------------------------------------------------------------------------
wf_group_is_protected: false

# ---------------------------------------------------------------------------
# 云上的部署参数（被 roles/baseline、docker_engine、app_stack 使用）
# ---------------------------------------------------------------------------

# 容器栈对外端口。刻意避开 80 —— 阿里云 ECS 的 user_data 已经在 80 上
# 起了系统 nginx（见 aliyun-ecs/ecs.tf）。两个声明式工具抢同一个端口
# 是这套项目一路在避免的事，所以这里主动错开。
wf_stack_port: 8080

# Docker 日志上限 —— 不限的话日志能把系统盘写满，是云上最常见的一种"突然挂了"
wf_docker_log_max_size: "10m"
wf_docker_log_max_file: "3"

# 镜像加速地址；国内拉官方镜像很慢时填，例如：
#   wf_docker_registry_mirrors:
#     - https://<你的加速器地址>.mirror.aliyuncs.com
wf_docker_registry_mirrors: []
