---
# ===========================================================================
# 云服务器（cloud 组）
#
# 定位：Terraform 创建的、可以随时 destroy 重建的机器。
#      所以这里允许「全量配置」—— 配错了重来一台就好，代价最低。
#
# 对照着看 group_vars/local.yml：那份才是受保护的。
# ===========================================================================

# 阿里云 ECS 默认用 root 登录，不需要 sudo
ansible_user: root
ansible_become: false

# 对应 aliyun-ecs 里创建的密钥对。
# ★ 如果 aliyun-ecs 用的是「实例密码」而不是密钥对，
#   把这里换成 ansible_password 并把 ansible_ssh_private_key_file 注释掉。
ansible_ssh_private_key_file: ~/.ssh/id_ed25519

# ---------------------------------------------------------------------------
# 保护声明：本组**不受保护**，允许变更
#
# guard 角色读这个值。它是"人可读的声明"，真正的判定还叠加了一条
# 「本机是否落在 local 组里」——两个条件取"或"，所以任何一边标对了就保护得上。
# ---------------------------------------------------------------------------
wf_group_is_protected: false

# ---------------------------------------------------------------------------
# 云上的部署参数（被 roles/baseline、docker_engine、app_stack 使用）
# ---------------------------------------------------------------------------

# 容器栈在宿主机**回环**上监听的端口。
#
# 它不是公网端口：公网唯一入口是系统 nginx 的 80，由 roles/app_stack 反代到
# 127.0.0.1:{{ wf_stack_port }}（见 roles/app_stack/templates/nginx.conf.j2）。
# 容器本身只绑 127.0.0.1，所以安全组里没有它，也不该有。
#
# 仍在 80 之外，是因为 80 归系统 nginx —— 两个进程不能同时 listen 同一个端口。
wf_stack_port: 8080

# Docker 日志上限 —— 不限的话日志能把系统盘写满，是云上最常见的一种"突然挂了"
wf_docker_log_max_size: "10m"
wf_docker_log_max_file: "3"

# ---------------------------------------------------------------------------
# 镜像加速 —— 云上第一道坎不是编排，是网络
#
# 国内很多区域直接连不上 registry-1.docker.io，现象是 `docker compose up -d`
# 卡 30 秒后报 `dial tcp ...:443: i/o timeout`（见 PITFALLS 第 47 条）。
# 这不是 compose 编排写错了，补 compose 文件也没用。
#
# ★ 推荐：阿里云账号自带的镜像加速器（免费、稳定、官方）
#   地址在「容器镜像服务 ACR → 镜像工具 → 镜像加速器」，形如
#     https://xxxxxxxx.mirror.aliyuncs.com
#   填成：
#
#     wf_docker_registry_mirrors:
#       - https://xxxxxxxx.mirror.aliyuncs.com
#
#   docker_engine 会把它写进 /etc/docker/daemon.json 并**重启 docker**，
#   再回头复核 `docker info` 里确实出现了这条地址
#   —— 写进文件 ≠ 生效，daemon.json 只在启动时读一次。
#
# ★ 没有加速器时，先看看这台机器够得着谁（只探测，不替你切换）：
#     curl -m 5 -o /dev/null -w '%{http_code}\n' https://docker.m.daocloud.io/v2/
#   200 或 401 都算连通（401 = 要认证，拉公开镜像时正常）；000 是连不上。
#
# ★ 第三方镜像站是别人的机器，可达不等于可信：生产环境优先用云厂商官方加速器。
#   完全不想经过任何第三方时，用离线镜像包（app_stack 的 wf_stack_image_tar）。
#
# ★ 注意：registry-mirrors 只对 **Docker Hub** 的镜像生效。
#   镜像名里带了别的 registry（如 registry.cn-hangzhou.aliyuncs.com/xxx）
#   就会绕过它 —— 那种情况靠加速器救不了，得换镜像或走离线包。
wf_docker_registry_mirrors: []
