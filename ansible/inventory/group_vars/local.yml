---
# ===========================================================================
# 本地服务器（local 组）——★★★ 默认完全只读 ★★★
#
# 定位：手工维护的存量环境。101 上的 Jenkins/Harbor 是 compose 栈、
#      102 上的 GitLab 是 Omnibus 实体服务，都是别人长期在用、且配置是
#      一点一点攒出来的。Ansible 到这里**只体检，不动手**。
#
# 保护是两层的，别只记住一层：
#
#   第 1 层 · 结构性隔离（roles/guard + playbooks/site.yml）
#     所有"会变更"的 role 只出现在 hosts: cloud 的 play 里。
#     本地服务器根本进不了那些 play —— 这是结构保证，不靠操作员自觉。
#
#   第 2 层 · 运行时断言（roles/guard 的 assert）
#     万一清单改错、或有人把某台本地机挪进 cloud 组，
#     guard 会在任务真正执行前直接失败并说明原因。
#
# 真要变更本地服务器，需要**两次显式解锁**（默认都是关的）：
#
#   -e local_mutation_allowed=true   → 允许变更（只补缺：装缺失的包、建缺失的目录）
#   -e local_overwrite_allowed=true  → 才允许覆盖已有的文件/设置（时区、sysctl…）
#
# 也就是说：只给第一个开关时，Ansible 也**不会覆盖任何已存在的东西**。
# 这就是「本地服务器不覆盖」的字面实现。
# ===========================================================================

# 本地机器是 ubuntu 用户登录，读特权目录 / 装包需要 sudo
# ★ 前置条件：该用户必须能**免密 sudo**，否则 become 会卡在密码提示。
#   验证：ssh ubuntu@192.168.193.147 'sudo -n true && echo OK'
ansible_user: ubuntu
ansible_become: true
ansible_become_method: sudo

ansible_ssh_private_key_file: ~/.ssh/id_ed25519

# ---------------------------------------------------------------------------
# ★ 保护声明：本组受保护
#
# guard 会把它和「本机是否落在 local 组」取"或"：
#   任一条成立 → 受保护（只读）
# 这样即使这里被误改成 false，只要机器还在 local 组里，保护依然生效。
# ---------------------------------------------------------------------------
wf_group_is_protected: true

# ---------------------------------------------------------------------------
# 本地**永远不碰**的路径清单
#
# 这些是"改了就等于抹掉现状"的东西。roles/baseline 在本地路径下会先断言
# 自己不会写到它们，作为第三道保险。
# ---------------------------------------------------------------------------
wf_local_forbidden_paths:
  - /data/jenkins-data          # Jenkins 全部数据（bind mount 源目录）
  - /var/opt/gitlab             # GitLab 全部仓库与配置
  - /etc/gitlab                 # GitLab Omnibus 配置
  - /etc/rancher/k3s            # K3s 集群配置
  - /var/lib/rancher/k3s        # K3s 数据
  - /root/.kube                 # kubeconfig
