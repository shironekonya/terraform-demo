---
# ===========================================================================
# 静态清单：本地服务器
#
# ★★ 这两台是「手工维护的存量环境」，不是 Terraform 创建的。
#    它们是这套环境里真正有价值的资产：
#        101  跑 K3s 控制平面 + Jenkins(compose 栈) + Harbor(compose 栈)
#        102  跑 K3s agent + GitLab(Omnibus 实体服务)
#
#    所以它们默认「完全只读」—— 由 group_vars/local.yml 的 wf_protected 声明，
#    再由 roles/guard 在运行时硬拦截。详见 roles/guard/tasks/main.yml 顶部说明。
#
# 云服务器**不写在这里**：
#    Terraform 创建/销毁后 IP 会变，手写必然过期。
#    用 tools/gen_cloud_inventory.py 从 terraform output 生成进去。
#    ansible.cfg 指向 inventory/ 目录，两份文件会被一起加载并合并。
# ===========================================================================

all:
  children:
    local:
      hosts:
        k3s-server:
          ansible_host: 192.168.193.147
          wf_note: "K3s 控制平面 + Jenkins(compose) + Harbor(compose)"

        k3s-agent:
          ansible_host: 192.168.193.139
          wf_note: "K3s agent + GitLab(Omnibus 实体服务)"
