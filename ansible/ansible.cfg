# ===========================================================================
# Ansible 配置 —— 批量管理「云服务器 + 本地服务器」
#
# ★★ 控制端必须是 Linux / macOS / WSL ★★
#    Ansible 依赖 os.fork 起 worker 进程，Windows 原生 Python 没有这个函数，
#    所以 Windows 上无法作为控制端运行（这不是配置问题，是平台限制）。
#    详见 README「环境要求 → Ansible 控制端」。
#
# ★ 如果你在 WSL 里从 /mnt/c/... 运行（drvfs 权限是 777）★★
#    Ansible 会拒绝把这个目录当作配置文件来源，直接忽略本文件：
#      [WARNING] Ansible is being run in a world writable directory (...),
#                ignoring it as an ansible.cfg source.
#    后果是 inventory 和 roles_path 全部失效，变成「对着隐式 localhost 跑空幕」。
#    chmod 没用（drvfs 上改不动权限）。两种解法：
#      ① 显式指定：export ANSIBLE_CONFIG=/mnt/c/.../ansible/ansible.cfg
#      ② 更好：把仓库放到 Linux 原生路径（~/ 下）再跑
#    正式部署（放到独立 Linux 服务器上）不会有这个问题 —— 原生文件系统权限正常。
# ===========================================================================

[defaults]
# inventory/ 目录下的所有文件都会被加载：
#   hosts.yml        —— 手写，本地服务器（受保护）
#   hosts.cloud.yml  —— 由 tools/gen_cloud_inventory.py 从 terraform output 生成
#
# ★ 清单目录里只放真正的清单。说明性文件（*.example）要放到 examples/，
#   否则 Ansible 会把它也当清单源去解析，报一串 "Exec format error" /
#   "Invalid host pattern" 之类的告警，看起来像清单坏了。
inventory               = inventory/
roles_path              = roles

# ★★ group_vars 必须在 inventory/group_vars/，不能放在本文件旁边 ★★
#
#   Ansible 找 group_vars / host_vars **只看两个地方**：
#     ① 清单文件旁边        ② playbook 文件旁边
#
#   本仓库的清单是 inventory/，playbook 是 playbooks/ —— 所以只有
#   inventory/group_vars/ 这一个位置会被读到。
#
#   放在仓库根本来是个很容易犯的错（很多示例都这么写，因为它们的
#   playbook 就在根目录）。放错的后果**不是报错**，而是整个 group_vars
#   被静默忽略，所有 wf_* 变量变成 undefined：
#     - wf_local_forbidden_paths 变成空清单 → 禁区断言形同虚设
#     - wf_report_dir 走 default → 报告写到别处
#     - guard 却看起来完全正常，因为 wf_in_local_group 来自 magic var groups[]
#   这就是最坏的失效形态：校验全绿、跑起来"也对"，只是少了一整层。
#   tools/check_guard.py 的 P8 会静态拦住它。

host_key_checking       = False
retry_files_enabled     = False
interpreter_python      = auto_silent
deprecation_warnings    = False

# 事实缓存：体检类 playbook 反复运行时快很多。
# 注意 ansible_date_time 之类"随时间变化"的事实会被缓存成旧值，
# 所以报告里的时间一律用 now() 现算，不读缓存。
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout    = 86400

# 每次运行都明确打印跳过的任务：本地服务器上"跳过了什么"是重要信息，
# 不能因为显示噪音而把保护动作藏起来。
display_skipped_hosts   = True

[privilege_escalation]
# 要不要提权由 group_vars 决定：
#   云服务器   → 直接 root 登录，不需要 sudo
#   本地服务器 → ubuntu 登录，装包/读特权目录需要 sudo（要求免密 sudo）
become_method           = sudo
become_user             = root
become_ask_pass         = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15
